name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test private repository access
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          echo "========================================"
          echo "Testing GitHub PAT"
          echo "========================================"

          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "ERROR: GH_STATS_TOKEN is empty or unavailable."
            exit 1
          fi

          echo "GH_STATS_TOKEN is available."

          echo ""
          echo "Authenticated user:"
          curl -fsS \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | jq -r '.login'

          echo ""
          echo "Private repositories accessible by the token:"
          curl -fsS \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/repos?visibility=private&per_page=100" \
            | jq -r '.[].full_name'

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Guivfs&show_icons=true&include_all_commits=true&count_private=true&theme=github_dark&hide=contribs
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Guivfs&layout=compact&langs_count=6&count_private=true&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
